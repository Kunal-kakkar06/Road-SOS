<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SOS Active — RoadSOS</title>
<meta name="description" content="RoadSOS SOS Active — help is on the way"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<style>
body{background:#fca311;min-height:100vh;display:flex;flex-direction:column}
.sos-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 16px 120px;gap:24px;max-width:640px;margin:0 auto;width:100%}
.sos-icon-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.sos-icon-ring{position:absolute;width:160px;height:160px;border-radius:50%;border:3px solid rgba(102,63,0,.3);animation:sos-ring-expand 1.5s ease-out infinite}
.sos-icon-ring:nth-child(2){animation-delay:.5s}
.sos-icon-ring:nth-child(3){animation-delay:1s}
@keyframes sos-ring-expand{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.feed-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0}
.feed-item+.feed-item{border-top:1px solid rgba(20,33,61,.08)}
.feed-dot-done{width:20px;height:20px;border-radius:50%;background:#27AE60;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.feed-dot-active{width:20px;height:20px;border-radius:50%;background:#fca311;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;animation:tlpulse 1s ease infinite}
.feed-dot-pending{width:20px;height:20px;border-radius:50%;border:2px solid #14213D;flex-shrink:0;margin-top:2px}
.cancel-bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:rgba(252,163,17,.95)}
</style>
</head>
<body>
<header style="background:transparent;border:none;height:56px;display:flex;align-items:center;padding:0 16px;justify-content:space-between">
  <span class="wordmark" style="color:#663f00"><span class="material-symbols-outlined icon-fill" style="font-size:24px;color:#663f00">emergency</span>RoadSOS</span>
  <span class="t-label-md" style="color:#663f00">SOS ACTIVE</span>
</header>

<div class="sos-screen">
  <!-- Animated icon -->
  <div class="sos-icon-wrap" style="margin-top:8px">
    <div class="sos-icon-ring"></div>
    <div class="sos-icon-ring"></div>
    <div class="sos-icon-ring"></div>
    <span class="material-symbols-outlined icon-fill" style="font-size:96px;color:#663f00;position:relative;z-index:1">emergency</span>
  </div>

  <div style="text-align:center">
    <h1 class="t-headline-xl" style="color:#663f00;font-size:clamp(28px,6vw,48px)">HELP IS ON THE WAY</h1>
    <p class="t-body-md" style="color:rgba(102,63,0,.75);margin-top:8px">Location shared · GPS locked</p>
  </div>

  <!-- Live feed -->
  <div class="card-level-2 rounded-xl" style="width:100%;padding:16px;animation:fadein .4s ease">
    <p class="t-label-md" style="color:#534433;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em">Live Status</p>
    <div class="feed-item">
      <div class="feed-dot-done"><span class="material-symbols-outlined icon-fill" style="font-size:12px;color:#fff">check</span></div>
      <div><p class="t-label-lg" style="color:#221a11">SOS Sent</p><p class="t-body-sm" style="color:#534433">0:03 ago</p></div>
    </div>
    <div class="feed-item">
      <div class="feed-dot-done"><span class="material-symbols-outlined icon-fill" style="font-size:12px;color:#fff">check</span></div>
      <div><p class="t-label-lg" style="color:#221a11">Nearest ambulance located</p><p class="t-body-sm" style="color:#534433">CATS Unit 4 · 2.4 km away</p></div>
    </div>
    <div class="feed-item">
      <div class="feed-dot-active"><span class="material-symbols-outlined" style="font-size:12px;color:#fff">arrow_forward</span></div>
      <div><p class="t-label-lg" style="color:#221a11">Dispatching now</p><p class="t-body-sm" style="color:#534433">ETA <strong>8 min</strong></p></div>
    </div>
    <div class="feed-item">
      <div class="feed-dot-pending"></div>
      <div><p class="t-label-lg" style="color:#534433">Family notified</p><p class="t-body-sm" style="color:#867461">Sarah K, David M</p></div>
    </div>
  </div>

  <!-- Mini map -->
  <div class="card-level-1 rounded-xl" style="width:100%;overflow:hidden">
    <div class="map-bg" style="height:140px">
      <div class="map-road h" style="top:50%"></div>
      <div class="map-road v" style="left:50%"></div>
      <!-- Ambulance moving -->
      <div style="position:absolute;top:calc(50% - 10px);animation:ambulance-move 4s ease-in-out infinite alternate">
        <span class="material-symbols-outlined icon-fill" style="font-size:20px;color:#006687">ambulance</span>
      </div>
      <!-- User dot -->
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"><div class="user-dot"></div></div>
      <!-- ETA badge -->
      <div style="position:absolute;top:8px;right:8px" class="eta-pill">ETA 8 min</div>
    </div>
  </div>
</div>

<!-- Cancel -->
<div class="cancel-bar">
  <button onclick="if(confirm('Cancel SOS? This will stop all dispatched units.'))window.location.href='code.html'"
    style="width:100%;min-height:56px;background:#382f25;color:#feeedf;border-radius:.75rem;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700"
    aria-label="Cancel SOS">
    Cancel SOS
  </button>
</div>
</body>
</html>
