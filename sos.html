<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SOS Active — RoadSOS</title>
<meta name="description" content="RoadSOS SOS Active — help is on the way"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet"/>
<link rel="stylesheet" href="css/shared.css"/>
<style>
body{background:#fca311;min-height:100vh;display:flex;flex-direction:column}
.sos-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px 16px 120px;gap:24px;max-width:640px;margin:0 auto;width:100%}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes slideUp {
  0% { opacity: 0; transform: translateY(15px); }
  100% { opacity: 1; transform: translateY(0); }
}
.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #14213D;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  box-sizing: border-box;
}
.sos-icon-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.sos-icon-ring{position:absolute;width:160px;height:160px;border-radius:50%;border:3px solid rgba(102,63,0,.3);animation:sos-ring-expand 1.5s ease-out infinite}
.sos-icon-ring:nth-child(2){animation-delay:.5s}
.sos-icon-ring:nth-child(3){animation-delay:1s}
@keyframes sos-ring-expand{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.feed-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0}
.feed-item+.feed-item{border-top:1px solid rgba(20,33,61,.08)}
.feed-dot-done{width:20px;height:20px;border-radius:50%;background:#27AE60;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.feed-dot-active{width:20px;height:20px;border-radius:50%;background:#fca311;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;animation:tlpulse 1s ease infinite}
.feed-dot-pending{width:20px;height:20px;border-radius:50%;border:2px solid #14213D;flex-shrink:0;margin-top:2px}
.cancel-bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:rgba(252,163,17,.95)}
</style>
</head>
<body>
<header style="background:transparent;border:none;height:56px;display:flex;align-items:center;padding:0 16px;justify-content:space-between">
  <span class="wordmark" style="color:#663f00"><span class="material-symbols-outlined icon-fill" style="font-size:24px;color:#663f00">emergency</span>RoadSOS</span>
  <span class="t-label-md" style="color:#663f00">SOS ACTIVE</span>
</header>

<div class="sos-screen">
  <!-- Animated icon (acts as SOS Trigger button) -->
  <div class="sos-icon-wrap" style="margin-top:8px; cursor: pointer;" onclick="handleSOSClick()">
    <div class="sos-icon-ring"></div>
    <div class="sos-icon-ring"></div>
    <div class="sos-icon-ring"></div>
    <span class="material-symbols-outlined icon-fill" style="font-size:96px;color:#663f00;position:relative;z-index:1">emergency</span>
  </div>

  <div style="text-align:center" id="sos-header-area">
    <h1 class="t-headline-xl" style="color:#663f00;font-size:clamp(28px,6vw,48px)">ACTIVATE SOS</h1>
    <p class="t-body-md" style="color:rgba(102,63,0,.75);margin-top:8px">Tap the SOS icon to scan nearest emergency units</p>
  </div>

  <!-- Dynamic Area for Ambulance Cards or Feed -->
  <div id="sos-status-area" style="width:100%; display:flex; flex-direction:column; gap:16px;">
    <div style="text-align: center; color: #663f00; font-weight: 600; padding: 20px;">
      <p class="t-body-lg" style="opacity: 0.85;">Press the large pulsing icon above to automatically match with available nearby responders.</p>
    </div>
  </div>
</div>

<!-- Cancel -->
<div class="cancel-bar">
  <button onclick="if(confirm('Cancel SOS? This will stop all dispatched units.'))window.location.href='index.html'"
    style="width:100%;min-height:56px;background:#382f25;color:#feeedf;border-radius:.75rem;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700"
    aria-label="Cancel SOS">
    Cancel SOS
  </button>
</div>

<script>
let gpsLat = null;
let gpsLng = null;

function handleSOSClick() {
  const header = document.getElementById('sos-header-area');
  const statusArea = document.getElementById('sos-status-area');
  
  header.innerHTML = `
    <h1 class="t-headline-xl" style="color:#663f00;font-size:clamp(28px,6vw,48px)">LOCATING FLEET</h1>
    <p class="t-body-md" style="color:rgba(102,63,0,.75);margin-top:8px">Establishing high-precision GPS lock...</p>
  `;

  statusArea.innerHTML = `
    <div style="text-align: center; padding: 30px; background: rgba(255,255,255,0.9); border-radius: 16px; border: 2px solid #14213D; box-shadow: 0 8px 0 rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div class="spinner"></div>
      <p class="t-label-lg" style="color: #663f00; font-size: 16px; margin: 0; font-family: 'Space Grotesk', sans-serif;">Scanning coordinates and contacting available ambulance fleets...</p>
    </div>
  `;

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        gpsLat = position.coords.latitude;
        gpsLng = position.coords.longitude;
        fetchNearbyAmbulances(gpsLat, gpsLng);
      },
      (error) => {
        console.warn("Geolocation failed or denied. Using fallback coordinates (Bengaluru).");
        gpsLat = 12.9352;
        gpsLng = 77.6245;
        fetchNearbyAmbulances(gpsLat, gpsLng);
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  } else {
    console.warn("Geolocation not supported. Using fallback coordinates.");
    gpsLat = 12.9352;
    gpsLng = 77.6245;
    fetchNearbyAmbulances(gpsLat, gpsLng);
  }
}

async function fetchNearbyAmbulances(lat, lng) {
  const header = document.getElementById('sos-header-area');
  const statusArea = document.getElementById('sos-status-area');

  try {
    const response = await fetch(`http://localhost:8000/api/ambulance/nearby?lat=${lat}&lng=${lng}&radius_km=10`);
    if (!response.ok) {
      throw new Error(`Nearby API failed: ${response.status}`);
    }
    const ambulances = await response.json();
    
    // Take the nearest 3
    const nearest3 = ambulances.slice(0, 3);
    
    if (nearest3.length === 0) {
      header.innerHTML = `
        <h1 class="t-headline-xl" style="color:#663f00;font-size:clamp(28px,6vw,48px)">NO RESPONDERS</h1>
        <p class="t-body-md" style="color:rgba(102,63,0,.75);margin-top:8px">No ambulances found within 10 km</p>
      `;
      statusArea.innerHTML = `
        <div style="background: #FFFDF4; border: 2px solid #382f25; border-radius: 16px; padding: 20px; box-shadow: 0 8px 0 rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 14px; text-align: center;">
          <p class="t-body-md" style="color: #663f00; margin: 0; font-weight: 700;">Could not automatically locate any available ambulance within range.</p>
          <a href="tel:108" style="background: #e63946; color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: 8px; box-shadow: 0 4px 6px rgba(230,57,70,0.3);">
            <span class="material-symbols-outlined icon-fill">call</span> Call 108 (Emergency)
          </a>
          <button onclick="location.reload()" style="color: #663f00; text-decoration: underline; font-weight: 700; font-size: 14px; background: transparent; border: none; cursor: pointer;">Retry Scanning</button>
        </div>
      `;
      return;
    }

    header.innerHTML = `
      <h1 class="t-headline-xl" style="color:#663f00;font-size:clamp(28px,6vw,48px)">FLEET RESPONDING</h1>
      <p class="t-body-md" style="color:rgba(102,63,0,.75);margin-top:8px">Select closest emergency unit below</p>
    `;

    let cardsHtml = `<div style="width: 100%; display: flex; flex-direction: column; gap: 14px; padding-bottom: 24px;">`;
    nearest3.forEach((amb) => {
      cardsHtml += `
        <div class="card-level-2" style="border-radius: 12px; padding: 16px; background: #fff; border: 2px solid #14213D; box-shadow: 0 6px 0 rgba(0,0,0,0.12); display: flex; flex-direction: column; gap: 12px; animation: slideUp 0.3s ease; box-sizing: border-box;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
              <div class="amb-icon-wrap" style="width: 40px; height: 40px; border-radius: 8px; background: #fff1e5; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><span class="material-symbols-outlined icon-fill" style="font-size:22px;color:#006687">ambulance</span></div>
              <div style="min-width: 0;">
                <span class="t-label-lg" style="font-size: 15px; color: #221a11; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${amb.provider_name}</span>
                <span class="t-body-sm" style="color: #534433; font-weight: 600;">Vehicle: ${amb.vehicle_number}</span>
              </div>
            </div>
            <span class="eta-pill" style="background: #fca311; color: #663f00; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px; flex-shrink: 0;">${amb.distance_km} km away</span>
          </div>
          
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; border-top: 1px solid rgba(20,33,61,0.08); padding-top: 10px;">
            <a href="tel:${amb.driver_phone}" style="display: inline-flex; align-items: center; gap: 6px; color: #006687; font-weight: 700; font-size: 13px; text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              <span class="material-symbols-outlined" style="font-size: 16px;">call</span> ${amb.driver_name}
            </a>
            <button class="dispatch-btn" onclick="dispatchAmbulance(${lat}, ${lng}, ${amb.id})" style="background: #e63946; color: #fff; border-radius: 8px; font-family:'Space Grotesk',sans-serif; font-size: 12px; font-weight: 700; padding: 8px 14px; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px;">
              <span>DISPATCH</span>
            </button>
          </div>
        </div>
      `;
    });
    cardsHtml += `</div>`;
    statusArea.innerHTML = cardsHtml;

  } catch (error) {
    console.error("Fetch Error:", error);
    header.innerHTML = `
      <h1 class="t-headline-xl" style="color:#663f00;font-size:clamp(28px,6vw,48px)">CONNECTION ERROR</h1>
      <p class="t-body-md" style="color:rgba(102,63,0,.75);margin-top:8px">Unable to reach dispatch network</p>
    `;
    statusArea.innerHTML = `
      <div style="background: #FFFDF4; border: 2px solid #382f25; border-radius: 16px; padding: 20px; box-shadow: 0 8px 0 rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 14px; text-align: center;">
        <p class="t-body-md" style="color: #663f00; margin: 0; font-weight: 700;">Could not establish a stable connection with dispatch servers.</p>
        <a href="tel:108" style="background: #e63946; color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: 8px; box-shadow: 0 4px 6px rgba(230,57,70,0.3);">
          <span class="material-symbols-outlined icon-fill">call</span> Call 108 (Emergency)
        </a>
        <button onclick="location.reload()" style="color: #663f00; text-decoration: underline; font-weight: 700; font-size: 14px; background: transparent; border: none; cursor: pointer;">Retry</button>
      </div>
    `;
  }
}

async function dispatchAmbulance(lat, lng, ambulanceId) {
  const statusArea = document.getElementById('sos-status-area');
  
  statusArea.innerHTML = `
    <div style="text-align: center; padding: 30px; background: rgba(255,255,255,0.9); border-radius: 16px; border: 2px solid #14213D; box-shadow: 0 8px 0 rgba(0,0,0,0.15); display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div class="spinner" style="border-color: #e63946; border-top-color: transparent;"></div>
      <p class="t-label-lg" style="color: #663f00; font-size: 16px; margin: 0; font-family: 'Space Grotesk', sans-serif;">Securing dispatch lock and assigning vehicle...</p>
    </div>
  `;

  try {
    const response = await fetch('http://localhost:8000/api/ambulance/request', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        lat: lat,
        lng: lng,
        address: 'SOS Location',
        patient_name: 'SOS User',
        patient_phone: '9999999999',
        severity: 5
      })
    });

    if (!response.ok) {
      throw new Error(`Dispatch POST failed: ${response.status}`);
    }

    const data = await response.json();
    if (data.dispatch_request_id) {
      window.location.href = `tracking.html?requestId=${data.dispatch_request_id}`;
    } else {
      alert("Error: Ambulance assignment could not be completed.");
      location.reload();
    }

  } catch (error) {
    console.error("Dispatch request failed:", error);
    alert("Emergency connection failed. Calling 108.");
    window.location.href = "tel:108";
  }
}
</script>
</body>
</html>
