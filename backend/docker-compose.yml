services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    command: >
      postgres
        -c wal_level=replica
        -c archive_mode=on
        -c "archive_command=mkdir -p /var/lib/postgresql/wal_archive && test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f"
        -c archive_timeout=300
        -c max_wal_senders=10
        -c wal_keep_size=128MB
    environment:
      POSTGRES_USER: roadsos
      POSTGRES_PASSWORD: roadsos_password
      POSTGRES_DB: roadsos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadsos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      bash -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "1.0.0"
      DATABASE_URL: postgresql+asyncpg://roadsos:roadsos_password@db:5432/roadsos_db
      ENVIRONMENT: production
      JWT_SECRET: roadsos-super-secret-production-key-32bytes-long-2026
    volumes:
      - .:/app
      - ../docs:/app/docs:ro
      - ../frontend:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://roadsos:roadsos_password@db:5432/roadsos_db
      ENVIRONMENT: production
      JWT_SECRET: roadsos-super-secret-production-key-32bytes-long-2026
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://roadsos:roadsos_password@db:5432/roadsos_db
      ENVIRONMENT: production
      JWT_SECRET: roadsos-super-secret-production-key-32bytes-long-2026
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  wal_archive:
